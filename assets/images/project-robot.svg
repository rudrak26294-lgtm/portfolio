<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgRobot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="100%" stop-color="#111c2e"/>
    </linearGradient>
    <linearGradient id="robotAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" fill="url(#bgRobot)"/>

  <!-- Grid Pattern -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.6">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="340"/>
    <line x1="200" y1="0" x2="200" y2="340"/>
    <line x1="300" y1="0" x2="300" y2="340"/>
    <line x1="400" y1="0" x2="400" y2="340"/>
    <line x1="500" y1="0" x2="500" y2="340"/>
  </g>

  <!-- Title Badge -->
  <g transform="translate(30, 25)">
    <rect width="180" height="26" rx="13" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
    <circle cx="15" cy="13" r="4" fill="#10b981"/>
    <text x="28" y="17" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">ROBOTICS &amp; EMBEDDED</text>
  </g>

  <!-- Robot Rover Illustration -->
  <g transform="translate(140, 60)">
    <!-- Rover Tracks / Wheels -->
    <!-- Left Track -->
    <rect x="30" y="150" width="70" height="28" rx="8" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
    <circle cx="45" cy="164" r="7" fill="#334155"/>
    <circle cx="65" cy="164" r="7" fill="#334155"/>
    <circle cx="85" cy="164" r="7" fill="#334155"/>
    <!-- Right Track -->
    <rect x="220" y="150" width="70" height="28" rx="8" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
    <circle cx="235" cy="164" r="7" fill="#334155"/>
    <circle cx="255" cy="164" r="7" fill="#334155"/>
    <circle cx="275" cy="164" r="7" fill="#334155"/>

    <!-- Main Chassis -->
    <rect x="60" y="80" width="200" height="90" rx="16" fill="url(#chassisGrad)" stroke="#10b981" stroke-width="2"/>
    
    <!-- Collector Hopper / Bin Container -->
    <rect x="80" y="95" width="80" height="60" rx="8" fill="#090d16" stroke="#334155" stroke-width="1.5"/>
    <path d="M100 115 L140 115 M100 125 L130 125 M100 135 L120 135" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <text x="120" y="150" fill="#64748b" font-family="monospace" font-size="9" text-anchor="middle">WASTE BIN</text>

    <!-- Arduino Control Module inside Rover -->
    <rect x="175" y="95" width="70" height="60" rx="8" fill="#005C8A" stroke="#00979C" stroke-width="1.5"/>
    <circle cx="190" cy="115" r="4" fill="#facc15"/>
    <circle cx="205" cy="115" r="4" fill="#10b981" filter="url(#glowGreen)"/>
    <circle cx="220" cy="115" r="4" fill="#38bdf8"/>
    <text x="210" y="140" fill="#f8fafc" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">MCU CTRL</text>

    <!-- Ultrasonic Eyes / Sensors on Top -->
    <rect x="135" y="45" width="50" height="35" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="148" cy="62" r="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="172" cy="62" r="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <!-- Sonar waves -->
    <path d="M135 30 Q160 15 185 30" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.8"/>
    <path d="M125 20 Q160 0 195 20" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.4"/>

    <!-- Front Mechanical Sweeper / Collector Arms -->
    <path d="M60 140 L20 160 L10 180" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="10" cy="180" r="4" fill="#f59e0b"/>
    <line x1="10" y1="180" x2="35" y2="185" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- System Features Callouts -->
  <g transform="translate(30, 285)">
    <rect width="540" height="32" rx="6" fill="#0b111e" stroke="#334155" stroke-width="1"/>
    <circle cx="20" cy="16" r="4" fill="#38bdf8"/>
    <text x="35" y="20" fill="#94a3b8" font-family="monospace" font-size="11">Architecture: Obstacle avoidance sonar + motor drivers + mechanized waste intake</text>
  </g>
</svg>

