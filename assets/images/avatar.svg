<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="50%" stop-color="#151f33"/>
      <stop offset="100%" stop-color="#1b2a47"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5d0b5"/>
      <stop offset="100%" stop-color="#e2b490"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2e39"/>
      <stop offset="100%" stop-color="#181a20"/>
    </linearGradient>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)"/>
  
  <!-- Subtle Circuit Grid Pattern in Background -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1.5">
    <circle cx="200" cy="200" r="170" fill="none" stroke-dasharray="6,8"/>
    <circle cx="200" cy="200" r="145" fill="none"/>
    <line x1="20" y1="200" x2="380" y2="200" stroke-dasharray="4,6"/>
    <line x1="200" y1="20" x2="200" y2="380" stroke-dasharray="4,6"/>
    <rect x="45" y="45" width="16" height="16" rx="4" fill="none"/>
    <rect x="339" y="339" width="16" height="16" rx="4" fill="none"/>
    <circle cx="65" cy="335" r="5" fill="#38bdf8"/>
    <circle cx="335" cy="65" r="5" fill="#a855f7"/>
  </g>

  <!-- Glowing Outer Ring -->
  <circle cx="200" cy="200" r="130" fill="none" stroke="url(#ringGrad)" stroke-width="4" filter="url(#glow)" opacity="0.85"/>
  <circle cx="200" cy="200" r="126" fill="#0d131f"/>

  <!-- Character / Developer Silhouette & Avatar -->
  <g id="character">
    <!-- Shoulders / Tech Hoodie -->
    <path d="M120 326 C120 270, 160 255, 200 255 C240 255, 280 270, 280 326 Z" fill="url(#hoodieGrad)"/>
    <path d="M175 258 L200 285 L225 258 Z" fill="#1e293b"/>
    <path d="M198 285 L198 326" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3"/>
    
    <!-- Neck -->
    <rect x="186" y="215" width="28" height="45" rx="6" fill="#d99f78"/>

    <!-- Head / Face -->
    <ellipse cx="200" cy="180" rx="46" ry="52" fill="url(#skinGrad)"/>

    <!-- Hair -->
    <path d="M152 175 C152 135, 175 125, 200 125 C225 125, 248 135, 248 175 C248 160, 240 148, 228 145 C215 142, 185 142, 172 145 C160 148, 152 160, 152 175 Z" fill="url(#hairGrad)"/>
    <!-- Modern swept hair styling -->
    <path d="M154 165 C158 140, 180 120, 215 120 C242 120, 252 135, 246 160 C242 145, 230 135, 212 135 C185 135, 166 148, 154 165 Z" fill="#20242e"/>

    <!-- Modern Tech Glasses -->
    <g id="glasses">
      <rect x="166" y="170" width="28" height="20" rx="5" fill="#1e293b" fill-opacity="0.25" stroke="#38bdf8" stroke-width="2.5"/>
      <rect x="206" y="170" width="28" height="20" rx="5" fill="#1e293b" fill-opacity="0.25" stroke="#38bdf8" stroke-width="2.5"/>
      <line x1="194" y1="179" x2="206" y2="179" stroke="#38bdf8" stroke-width="2.5"/>
      <line x1="156" y1="176" x2="166" y2="176" stroke="#38bdf8" stroke-width="2"/>
      <line x1="234" y1="176" x2="244" y2="176" stroke="#38bdf8" stroke-width="2"/>
      <!-- Subtle reflection in lens -->
      <line x1="170" y1="184" x2="178" y2="174" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      <line x1="210" y1="184" x2="218" y2="174" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    </g>

    <!-- Smile -->
    <path d="M192 208 Q200 216 208 208" fill="none" stroke="#ba7954" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Floating Badge: AI / CS Student -->
  <g transform="translate(115, 305)">
    <rect width="170" height="34" rx="17" fill="#0b111e" stroke="#6366f1" stroke-width="1.5" filter="url(#glow)"/>
    <circle cx="20" cy="17" r="5" fill="#10b981"/>
    <text x="35" y="22" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">CS &amp; AI DEVELOPER</text>
  </g>

  <!-- Orbiting Tech Elements -->
  <g transform="translate(68, 120)">
    <rect width="36" height="24" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="18" y="16" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">&lt;/&gt;</text>
  </g>

  <g transform="translate(295, 125)">
    <rect width="38" height="24" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/>
    <text x="19" y="16" fill="#c084fc" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">AI::*</text>
  </g>

  <g transform="translate(290, 240)">
    <circle cx="16" cy="16" r="15" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
    <text x="16" y="20" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">⚡</text>
  </g>
</svg>

