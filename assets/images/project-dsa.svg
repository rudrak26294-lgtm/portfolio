<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDsa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="100%" stop-color="#191730"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glowDsa" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="340" fill="url(#bgDsa)"/>

  <!-- Grid Pattern -->
  <g stroke="#262244" stroke-width="1" opacity="0.6">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="340"/>
    <line x1="200" y1="0" x2="200" y2="340"/>
    <line x1="300" y1="0" x2="300" y2="340"/>
    <line x1="400" y1="0" x2="400" y2="340"/>
    <line x1="500" y1="0" x2="500" y2="340"/>
  </g>

  <!-- Title Badge -->
  <g transform="translate(30, 25)">
    <rect width="180" height="26" rx="13" fill="#1e1b4b" stroke="#a855f7" stroke-width="1"/>
    <circle cx="15" cy="13" r="4" fill="#c084fc"/>
    <text x="28" y="17" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">ALGORITHMS &amp; DATA STRUCTURES</text>
  </g>

  <!-- Code Window Terminal (Left) -->
  <g transform="translate(40, 75)">
    <rect width="250" height="190" rx="10" fill="#0c0e1a" stroke="#4338ca" stroke-width="1.5"/>
    <!-- Terminal header -->
    <rect width="250" height="26" rx="10" fill="#18182f"/>
    <rect x="0" y="16" width="250" height="10" fill="#18182f"/>
    <circle cx="16" cy="13" r="4" fill="#ef4444"/>
    <circle cx="28" cy="13" r="4" fill="#f59e0b"/>
    <circle cx="40" cy="13" r="4" fill="#10b981"/>
    <text x="125" y="17" fill="#6366f1" font-family="monospace" font-size="9" text-anchor="middle">solution.cpp</text>
    
    <!-- Code lines -->
    <text x="16" y="52" fill="#c084fc" font-family="monospace" font-size="11">template &lt;typename T&gt;</text>
    <text x="16" y="72" fill="#38bdf8" font-family="monospace" font-size="11">void <tspan fill="#facc15">dijkstra</tspan>(int src) {</text>
    <text x="28" y="92" fill="#94a3b8" font-family="monospace" font-size="11">priority_queue&lt;pair&gt; pq;</text>
    <text x="28" y="112" fill="#94a3b8" font-family="monospace" font-size="11">dist[src] = 0;</text>
    <text x="28" y="132" fill="#ec4899" font-family="monospace" font-size="11">while (!pq.empty()) {</text>
    <text x="40" y="152" fill="#34d399" font-family="monospace" font-size="11">// relax edges</text>
    <text x="28" y="172" fill="#ec4899" font-family="monospace" font-size="11">}</text>
  </g>

  <!-- Binary Tree / Graph Visualization (Right) -->
  <g transform="translate(320, 75)">
    <!-- Edges -->
    <line x1="120" y1="35" x2="60" y2="90" stroke="#6366f1" stroke-width="2.5"/>
    <line x1="120" y1="35" x2="180" y2="90" stroke="#6366f1" stroke-width="2.5"/>
    <line x1="60" y1="90" x2="30" y2="150" stroke="#6366f1" stroke-width="2.5"/>
    <line x1="60" y1="90" x2="90" y2="150" stroke="#6366f1" stroke-width="2.5"/>
    <line x1="180" y1="90" x2="150" y2="150" stroke="#6366f1" stroke-width="2.5"/>
    <line x1="180" y1="90" x2="210" y2="150" stroke="#6366f1" stroke-width="2.5"/>

    <!-- Nodes -->
    <!-- Root -->
    <circle cx="120" cy="35" r="18" fill="#1e1b4b" stroke="#a855f7" stroke-width="2.5" filter="url(#glowDsa)"/>
    <text x="120" y="40" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">50</text>

    <!-- Level 1 -->
    <circle cx="60" cy="90" r="16" fill="#1e1b4b" stroke="#38bdf8" stroke-width="2"/>
    <text x="60" y="95" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">25</text>

    <circle cx="180" cy="90" r="16" fill="#1e1b4b" stroke="#38bdf8" stroke-width="2"/>
    <text x="180" y="95" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">75</text>

    <!-- Level 2 -->
    <circle cx="30" cy="150" r="14" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
    <text x="30" y="154" fill="#cbd5e1" font-family="monospace" font-size="10" text-anchor="middle">10</text>

    <circle cx="90" cy="150" r="14" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
    <text x="90" y="154" fill="#cbd5e1" font-family="monospace" font-size="10" text-anchor="middle">30</text>

    <circle cx="150" cy="150" r="14" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
    <text x="150" y="154" fill="#cbd5e1" font-family="monospace" font-size="10" text-anchor="middle">60</text>

    <circle cx="210" cy="150" r="14" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
    <text x="210" y="154" fill="#cbd5e1" font-family="monospace" font-size="10" text-anchor="middle">85</text>

    <!-- Complexity Tag -->
    <rect x="75" y="180" width="90" height="22" rx="11" fill="#312e81" stroke="#818cf8" stroke-width="1"/>
    <text x="120" y="195" fill="#c7d2fe" font-family="monospace" font-size="10" text-anchor="middle">O(log N)</text>
  </g>

  <!-- Bottom Callout -->
  <g transform="translate(30, 285)">
    <rect width="540" height="32" rx="6" fill="#0b111e" stroke="#334155" stroke-width="1"/>
    <circle cx="20" cy="16" r="4" fill="#a855f7"/>
    <text x="35" y="20" fill="#94a3b8" font-family="monospace" font-size="11">Languages: C • C++ • Python | Trees, Graphs, Sorting &amp; Competitive Programming</text>
  </g>
</svg>

